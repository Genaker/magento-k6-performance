# Magento sample data storefront mix - same pages on Luma, Hyvä and Flux.
# Run:  k6 run magento.js -e PLAN=plans/sample-data.yml -e SITE=flux
# Before a load test, check every page returns data:
#       npm run validate -- --plan plans/sample-data.yml --site flux --all-terms
# Point it at your hosts with -e BASE_URL=/API_BASE= or -e SITES=<your sites.yml>.
name: Magento sample data mix
description: Home 10%, 16 categories 32%, 16 products 32%, search 20%, CMS 2%, cart 3%, checkout 1%.

sites:                       # pick one with -e SITE=<name>; platform defaults to the site name
  luma:
    base_url: https://luma.example.com
    platform: luma
  hyva:
    base_url: https://hyva.example.com
    platform: hyva
  flux:
    base_url: https://flux.example.com
    api_base: https://flux-api.example.com   # Magento GraphQL host the Flux browser calls
    platform: flux

load:                        # same as the -e options (MODE, VUS, ...); -e wins
  mode: rps                  # vus | rps | iterations
  rps: 20
  duration: 5m
  sleep: 0

thresholds:                  # breaking one fails the run (non-zero exit code)
  t_p95: 3000                # p95 of all page responses, ms
  t_hit: 800                 # p95 of planned cache hits, ms
  t_miss: 4000               # p95 of planned cache misses (full render), ms
  max_error_rate: 0.01       # page errors incl. missing expected content
  max_api_error_rate: 0.01   # browser sub-request errors

options:
  debug_header: true         # send X-Magento-Debug: 1 to read X-Magento-Cache-Debug

search_terms_file: ../scenarios/search-terms.txt   # path relative to this plan

# Requests the browser makes after the page, per page type ("*" = every type).
# Captured from real guest sessions. A planned cache miss busts these too.
platforms:
  luma:                      # Magento Commerce Luma: dynamic banners on every page (uncached PHP)
    calls:
      "*":
        - name: banner_ajax
          url: /banner/ajax/load/?requesting_page_url={page_url}&sections=&_={ts}
          headers: { X-Requested-With: XMLHttpRequest }
          expect: '"store_id"'
      search:
        - name: search_terms_log
          url: /catalogsearch/searchTermsLog/save/?q={term}&_={ts}
          headers: { X-Requested-With: XMLHttpRequest }
  hyva:                      # Hyvä: no XHR for a guest without a session/cart
    calls: {}
  flux:                      # Flux (Next.js): pages are server-rendered; the search grid comes
    calls:                   # from Magento GraphQL in the browser - twice (sort ASC, then DESC)
      search:
        - name: gql_search_products
          url: "{api_base}/graphql?query=query+getProductsList%28%24search%3A+String%2C+%24filters%3A+ProductAttributeFilterInput%2C+%24pageSize%3A+Int%2C+%24currentPage%3A+Int%2C+%24sort%3A+ProductAttributeSortInput%29+%7B+products%28+search%3A+%24search+pageSize%3A+%24pageSize+currentPage%3A+%24currentPage+filter%3A+%24filters+sort%3A+%24sort+%29+%7B+total_count+aggregations%28filter%3A+%7Bcategory%3A+%7BincludeDirectChildrenOnly%3A+true%7D%7D%29+%7B+position+attribute_code+count+label+options+%7B+label+count+value+__typename+%7D+__typename+%7D+sort_fields+%7B+default+options+%7B+label+value+__typename+%7D+__typename+%7D+suggestions+%7B+search+__typename+%7D+category_block+%7B+content_json+__typename+%7D+items+%7B+uid+id+sku+name+url_key+url_suffix+stock_status+short_description+%7B+html+__typename+%7D+rating_summary+review_count+ba_product_flags+%7B+value+label+__typename+%7D+small_image+%7B+...ProductSmallImageFragment+__typename+%7D+price_range+%7B+...ProductPriceFragment+__typename+%7D+price_tiers+%7B+...ProductTiersPriceFragment+__typename+%7D+...+on+ConfigurableProduct+%7B+...ConfigurableProductVariantsFragment+__typename+%7D+__typename+%7D+page_info+%7B+current_page+page_size+__typename+%7D+__typename+%7D+__typename+%7D+fragment+ProductSmallImageFragment+on+ProductImage+%7B+url+label+url_resized%28+sizes%3A+%5B%7Buid%3A+%22common%22%2C+width%3A+312%2C+height%3A+272%7D%2C+%7Buid%3A+%22thumbnail%22%2C+width%3A+100%2C+height%3A+74%7D%5D+%29+%7B+uid+url+width+height+__typename+%7D+__typename+%7D+fragment+ProductGalleryImageFragment+on+ProductImage+%7B+url_resized%28+sizes%3A+%5B%7Buid%3A+%22common%22%2C+width%3A+871%2C+height%3A+650%7D%2C+%7Buid%3A+%22thumbnail%22%2C+width%3A+100%2C+height%3A+74%7D%5D+%29+%7B+uid+url+width+height+__typename+%7D+url+label+position+disabled+__typename+%7D+fragment+ProductGalleryVideoFragment+on+ProductVideo+%7B+url_resized%28+sizes%3A+%5B%7Buid%3A+%22common%22%2C+width%3A+871%2C+height%3A+650%7D%2C+%7Buid%3A+%22thumbnail%22%2C+wi