name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  smoke:
    name: Smoke load test (k6 vs mock Magento)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: grafana/setup-k6-action@v1
      - run: k6 version
      - run: bash smoke/run.sh
